# =========================================================
# Render 蓝图（免信用卡 · 永久免费）
# =========================================================
#
# 两个服务都是免费 Web 服务（15 分钟无访问会休眠，
# 用 UptimeRobot 每 5 分钟 ping 一次即可保持 24 小时在线）。
#
# 数据库用 Supabase 的免费 Postgres（24 小时在线、不休眠），
# 所以数据永远在，只是应用/中间件的“计算”会冷启动。
#
# 部署方式：把本项目推到 GitHub 私有仓库，
# 在 Render 点 “New” → “Blueprint” → 选仓库 → 上传本文件即可。
#
# 标 sync:false 的变量需要你在 Render 后台手动填：
#   - nocodb 的 NC_SITE_URL / NC_AUTH_JWT_SECRET
#   - app 的 NOCODB_BASE_URL / NOCODB_API_TOKEN / 加密密钥
# 详见《部署到Render+Supabase（免信用卡永久免费）.md》
# =========================================================

services:
  # ---------------- NocoDB 数据中间件 ----------------
  - type: web
    name: cixian-nocodb
    runtime: docker
    # 与本地开发环境同一版本（按摘要锁定），保证库结构一致
    image: docker.io/nocodb/nocodb@sha256:4b760f0d25471fb49707d515f161d9d36b49c88e7ecbe25eded774af385be5a9
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # Supabase 直连地址（端口 5432，不是 6543 连接池）
      # 格式：pg://主机:5432?u=postgres&p=密码&d=postgres&ssl=1
      - key: NC_DB
        sync: false
      # 公网地址（部署后在 Render 后台填 https://cixian-nocodb.onrender.com）
      - key: NC_SITE_URL
        sync: false
      # JWT 签名密钥：用 Render 的 generateValue 生成一次并固定，
      # 否则每次重启 NocoDB 旧 token 会失效
      - key: NC_AUTH_JWT_SECRET
        generateValue: true
      - key: NC_SECURE_ATTACHMENTS
        value: 'true'
      - key: NC_DISABLE_MUX
        value: 'true'
      - key: NC_TOOL_DIR
        value: /usr/app/data/

  # ---------------- 应用（后端 + 前端）----------------
  - type: web
    name: cixian-app
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: '3001'
      - key: NODE_ENV
        value: production
      # 部署后填 https://cixian-nocodb.onrender.com
      - key: NOCODB_BASE_URL
        sync: false
      # 部署后在 NocoDB 后台生成，见文档第 5 步
      - key: NOCODB_API_TOKEN
        sync: false
      # 必须与本地 backend/.env 里的完全一致（否则前端密文解不开）
      - key: PAYLOAD_ENC_KEY
        sync: false
      - key: DATA_ENC_KEY
        sync: false
      # Render 默认提供 HTTPS，开启强制跳转
      - key: FORCE_HTTPS
        value: '1'
      - key: ALLOWED_ORIGIN
        value: '*'
      - key: RATE_LIMIT_MAX
        value: '600'
      - key: SESSION_TTL_HOURS
        value: '12'
