# =========================================================
# 附件代理（把 NocoDB 后台从公网藏起来）
# =========================================================
#
# 背景：
#
#     帮扶照片存在 NocoDB 里，
#     前端拿到的图片地址形如
#     http://<服务器>:8080/dltemp/xxxx/photo.jpg
#     也就是说浏览器必须能访问到 8080。
#
#     但直接把 NocoDB 的 8080 暴露到公网，
#     等于把它的**管理后台也一起敞开了**
#     ——任何人都能打开登录页尝试爆破。
#
# 做法：
#
#     这一层 Nginx 占住公网的 8080，
#     只放行附件相关的几个路径，
#     其余（管理界面 / 数据接口）一律 404。
#
#     NocoDB 容器本身不再对外发布端口，
#     只存在于 Docker 内网。
# =========================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 30m;

    access_log off;
    error_log  /var/log/nginx/error.log warn;

    # ---------- 只允许的附件路径 ----------
    #
    #   /download/    附件原始路径（部分版本直接用）
    #   /dltemp/      NocoDB 的签名下载路径（前端实际在用）
    #   /thumbnail/   缩略图
    #
    location ~ ^/(download|dltemp|thumbnail)/ {
        proxy_pass http://nocodb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 图片可缓存，减轻源站压力
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- 健康检查（容器自检用） ----------
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # ---------- 其余一切（含管理后台）一律拒绝 ----------
    location / {
        return 404;
    }
}
